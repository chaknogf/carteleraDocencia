<!-- Modal -->
<div class="modal-backdrop" *ngIf="visible()">
  <div class="modal d-block" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content position-relative">
        <button class="btn close-button" aria-label="Cerrar" (click)="close()">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6L6 18"></path>
            <path d="M6 6l12 12"></path>
          </svg>
        </button>
        <div class="modal-body">
          <app-login></app-login>
        </div>
      </div>
    </div>
  </div>
</div>
